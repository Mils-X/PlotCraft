[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plotcraft"
version = "0.5.0"
description = "Gráficos científicos y estadística con interfaz sencilla (inspirada en flujos tipo Prism/Origin)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PySide6>=6.5", "matplotlib>=3.7", "numpy>=1.24", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=7", "statsmodels>=0.14", "scikit-posthocs>=0.9", "lmfit>=1.2"]

[project.scripts]
plotcraft = "plotcraft.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
plotcraft = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
